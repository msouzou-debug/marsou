{% extends "base.html" %}
{% block title %}{{ t('password.title') }} · {{ t('app.name') }}{% endblock %}
{% block content %}
<div class="row">
  <div class="col-12 col-md-8 col-lg-6 col-xl-5">
    <h1 class="h4 mb-3">{{ t('password.title') }}</h1>
    {% if error %}<div class="alert alert-danger" role="alert">{{ t(error[0], **error[1]) }}</div>{% endif %}
    <form method="post" action="{{ url_for('auth.password') }}" class="ehire-panel">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="mb-3">
        <label class="form-label" for="password">{{ t('password.new') }}</label>
        <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" for="repeat">{{ t('password.repeat') }}</label>
        <input class="form-control" id="repeat" name="repeat" type="password" autocomplete="new-password" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">{{ t('password.submit') }}</button>
    </form>
  </div>
</div>
{% endblock %}
