{% extends "base.html" %}
{% block title %}{{ t('password.title') }} · {{ t('app.name') }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-8 col-md-5">
    <h1 class="h4 mb-3">{{ t('password.title') }}</h1>
    {% if error %}<div class="alert alert-danger" role="alert">{{ t(error[0], **error[1]) }}</div>{% endif %}
    <form method="post" action="{{ url_for('auth.password') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="mb-3">
        <label class="form-label" for="password">{{ t('password.new') }}</label>
        <input class="form-control form-control-lg" id="password" name="password" type="password" autocomplete="new-password" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" for="repeat">{{ t('password.repeat') }}</label>
        <input class="form-control form-control-lg" id="repeat" name="repeat" type="password" autocomplete="new-password" required>
      </div>
      <button class="btn btn-primary btn-lg w-100" type="submit">{{ t('password.submit') }}</button>
    </form>
  </div>
</div>
{% endblock %}
