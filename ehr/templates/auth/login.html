{% extends "base.html" %}
{% block title %}{{ t('login.title') }} · {{ t('app.name') }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-8 col-md-5">
    <h1 class="h4 mb-3">{{ t('login.title') }}</h1>
    {% if error %}<div class="alert alert-danger" role="alert">{{ t(error, **(error_params or {})) }}</div>{% endif %}
    <form method="post" action="{{ url_for('auth.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="mb-3">
        <label class="form-label" for="username">{{ t('login.username') }}</label>
        <input class="form-control form-control-lg" id="username" name="username" autocomplete="username" autofocus required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">{{ t('login.password') }}</label>
        <input class="form-control form-control-lg" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary btn-lg w-100" type="submit">{{ t('login.submit') }}</button>
    </form>
  </div>
</div>
{% endblock %}
