<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ t('app.name') }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap-icons/bootstrap-icons.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/ehr-tokens.css') }}">
</head>
<body>
  <div class="ehr-accent-bar"></div>
  <nav class="navbar border-bottom">
    <div class="container-fluid">
      <span class="navbar-brand fw-bold text-primary">{{ t('app.name') }} · {{ t('module.position_approval') }}</span>
      <span aria-label="{{ t('nav.language') }}">
        <a class="btn btn-sm btn-link" href="?lang=el" lang="el">Ελληνικά</a>
        <a class="btn btn-sm btn-link" href="?lang=en" lang="en">English</a>
      </span>
    </div>
  </nav>
  <main class="container py-4">{% block content %}{% endblock %}</main>
  <script src="{{ url_for('static', filename='vendor/bootstrap/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
