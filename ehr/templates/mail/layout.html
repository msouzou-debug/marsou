<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#F3F5F7;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F3F5F7;">
<tr><td align="center" style="padding:12px 8px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;background:#FFFFFF;border:1px solid #D9DEE3;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1F2933;">
<tr><td style="background:{{ bar.bg }};color:{{ bar.fg }};border-left:6px solid {{ bar.border }};padding:14px 16px;font-size:18px;line-height:24px;font-weight:700;">{{ label }}</td></tr>
<tr><td style="padding:20px 16px 8px 16px;font-size:16px;line-height:24px;">{{ intro }}</td></tr>
<tr><td style="padding:8px 16px 4px 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
{% for name, value in facts %}
<tr><td style="padding:8px 0;border-top:1px solid #E4E8EC;font-size:12px;line-height:16px;color:#5B6670;">{{ name }}<br><span style="display:block;margin-top:2px;font-size:15px;line-height:21px;color:#1F2933;">{{ value }}</span></td></tr>
{% endfor %}
</table>
</td></tr>
{% if comment %}
<tr><td style="padding:8px 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td style="background:#F3F5F7;border-left:4px solid {{ bar.border }};padding:10px 12px;font-size:15px;line-height:21px;color:#1F2933;"><span style="display:block;font-size:12px;line-height:16px;color:#5B6670;">{{ comment_label }}</span>{{ comment }}</td></tr></table>
</td></tr>
{% endif %}
<tr><td style="padding:16px 16px 20px 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td align="center" bgcolor="#1B75BB" style="background:#1B75BB;border-radius:4px;"><a href="{{ url }}" style="display:block;box-sizing:border-box;min-height:44px;padding:12px 24px;font-size:16px;line-height:20px;font-weight:700;color:#FFFFFF;text-decoration:none;text-align:center;">{{ button }}</a></td></tr></table>
</td></tr>
<tr><td style="padding:12px 16px;border-top:1px solid #E4E8EC;font-size:12px;line-height:17px;color:#5B6670;">{{ footer }}</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
