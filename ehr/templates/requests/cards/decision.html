{# dir_exec, ceo: approve or reject. Reject needs a comment (the server enforces it; the browser asks first). #}
{% from "components/card_fields.html" import comment with context %}
{{ comment(c) }}
<div class="ehr-card__main d-flex flex-column flex-sm-row gap-2">
  <button class="btn btn-primary" type="submit" name="action" value="approve">{{ t('action.approve') }}</button>
  <button class="btn btn-outline-danger" type="submit" name="action" value="reject" data-ehr-needs-comment>{{ t('action.reject') }}</button>
</div>
