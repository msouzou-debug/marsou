# /etc/nginx/sites-available/taep
#
# Gunicorn listens on 127.0.0.1 only; nginx is what the hospitals reach. Patient names
# and identity numbers cross this hop, so it is TLS even inside the ΟΚΥπΥ network.
server {
    listen 443 ssl;
    server_name taep.okypy.local;

    ssl_certificate     /etc/ssl/okypy/taep.crt;
    ssl_certificate_key /etc/ssl/okypy/taep.key;

    client_max_body_size 8m;        # the tariff upload

    # Anti-framing headers (Content-Security-Policy frame-ancestors, X-Frame-Options)
    # are set by the application, standalone/host.py, on every response. Do NOT add them
    # here as well: add_header does not replace an upstream header, so the response would
    # carry two X-Frame-Options lines, and some browsers treat a duplicate as invalid and
    # ignore both — which looks fixed and is not.

    location / {
        proxy_pass http://127.0.0.1:5055;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;    # the PDF and the Excel export
    }
}

server {
    listen 80;
    server_name taep.okypy.local;
    return 301 https://$host$request_uri;
}
